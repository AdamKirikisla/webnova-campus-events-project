<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../public/css/styles.css" />
    <link rel="stylesheet" href="../public/css/about.css" />
    <link rel="icon" href="../public/images/logo.webp" type="image/webp" />
    <title>WebNova - About & Contact</title>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo-link">
        <img src="../public/images/logo.webp" alt="Logo" />
        <h1>WebNova</h1>
      </a>
      <nav>
        <a href="index.html" class="btn btn-outline">Home</a>
        <a href="login.html" class="btn btn-outline">Login</a>
        <a href="login.html?mode=signup" class="btn btn-primary">Sign Up</a>
      </nav>
    </header>

    <main class="about-main">
      <div class="card content-card">
        <h2>About WebNova</h2>
        <p>
          WebNova was built to simplify campus life. Our platform connects students with the best activities and helps
          organizers create seamless events.
        </p>
      </div>
      <!-- Contact section with an anchor ID for targeted page scrolling -->
      <div id="contact" class="card content-card">
        <h2>Get in Touch</h2>
        <p>Have a question or need support? Send us a message!</p>
        <!-- Standard form structure for user inquiries -->
        <form class="contact-form" action="#" method="POST">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com" />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" required placeholder="How can we help you?"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </main>

    <footer>
      <p>
        © 2026
        <a href="about.html" class="footer-link">WebNova</a>
        . All rights reserved.
      </p>
    </footer>
  </body>
</html>
