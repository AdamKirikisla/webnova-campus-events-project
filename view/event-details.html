<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../public/images/logo.webp" type="image/webp" />
    <link rel="stylesheet" href="../public/css/styles.css" />
    <link rel="stylesheet" href="../public/css/student.css" />
    <link rel="stylesheet" href="../public/css/event-details.css" />
    <title>WebNova - Event Details</title>
    <!-- Chargement des scripts -->
    <script src="../public/js/events-data.js" defer></script>
    <script src="../public/js/nav-search.js" defer></script>
    <script src="../public/js/event-details.js" defer></script>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo-link">
        <img src="../public/images/logo.webp" alt="Logo" class="logo" />
        <h1>WebNova</h1>
      </a>
      <nav class="top-nav">
        <div class="nav-search">
          <form id="nav-search-form" role="search" autocomplete="off">
            <input
              type="search"
              id="nav-search-input"
              placeholder="Search events"
              aria-label="Search events"
              aria-expanded="false"
              aria-controls="nav-search-results"
            />
          </form>
          <ul id="nav-search-results" class="nav-search-results" hidden></ul>
        </div>
        <a href="student-dashboard.html" class="btn btn-outline">Dashboard</a>
        <a href="student-profile.html" class="btn btn-outline">Profile</a>
        <a href="my-events.html" class="btn btn-outline">My Events</a>
        <a href="#" class="btn btn-primary" id="logout-btn">Logout</a>
      </nav>
    </header>

    <main>
      <div class="dashboard-shell">
        <section class="hero-card" style="margin-bottom: 1rem">
          <div>
            <h1 id="event-title">Loading event...</h1>
            <p>Review event details and manage your registration.</p>
          </div>
        </section>

        <div class="details-card">
          <div class="details-grid" id="event-details">
            <!-- Injecté via JavaScript -->
          </div>

          <div id="dynamic-actions">
            <!-- Les boutons S'inscrire/Drop/Attended iront ici -->
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 WebNova. All rights reserved.</p>
    </footer>
  </body>
</html>
