<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../public/css/styles.css" />
    <link rel="stylesheet" href="../public/css/student.css" />
    <title>Event Registration</title>
    <style>
      .registration-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .registration-form label {
        font-weight: 600;
        color: #333;
      }

      .registration-form input,
      .registration-form select {
        padding: 0.75rem 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font: inherit;
      }

      .registration-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo-link">
        <img src="../public/images/logo.webp" alt="Logo" class="logo" />
        <h1>WebNova</h1>
      </a>
    </header>

    <main>
      <div class="dashboard-shell">
        <section class="hero-card">
          <div>
            <h1>Event Registration</h1>
            <p>Register for your next campus event below.</p>
          </div>
        </section>

        <div class="panel" style="max-width: 700px; width: 100%">
          <h3>Registration Form</h3>
          <form class="registration-form">
            <label for="event">Select Event</label>
            <select id="event" name="event" required>
              <option value="">Choose an event</option>
              <option value="Campus Welcome Social">Campus Welcome Social</option>
              <option value="Career Fair">Career Fair</option>
              <option value="Student Networking Night">Student Networking Night</option>
            </select>

            <label for="full-name">Full Name</label>
            <input id="full-name" name="fullName" type="text" placeholder="Enter your full name" required />

            <label for="student-id">Student ID</label>
            <input id="student-id" name="studentId" type="text" placeholder="Enter your student ID" required />

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required />

            <div class="registration-actions">
              <button type="submit" class="btn btn-primary">Submit Registration</button>
              <a href="student-event.html" class="btn btn-outline">Back to Events</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 WebNova. All rights reserved.</p>
    </footer>
  </body>
</html>
