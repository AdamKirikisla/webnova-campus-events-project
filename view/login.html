<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../public/css/styles.css" />
    <link rel="stylesheet" href="../public/css/login.css" />
    <link rel="icon" href="../public/images/logo.webp" type="image/webp" />
    <title>WebNova - Login</title>
    <!-- <script src="../public/js/events-data.js" defer></script> -->
    <script src="../public/js/seed.js" defer></script>
    <script src="../public/js/auth.js" defer></script>
  </head>
  <body>
    <main>
      <div class="auth-wrapper">
        <div class="auth-card">
          <div class="auth-header">
            <button id="toggle-login" type="button">Login</button>
            <button id="toggle-signup" type="button">Sign Up</button>
          </div>

          <!-- Connexion form -->
          <form id="form-login" class="auth-form hidden">
            <h2>Welcome back</h2>
            <div class="input-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" required placeholder="user@live.concordia.ca" />
            </div>
            <div class="input-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required placeholder="********" />
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>

          <!-- Sign Up form -->
          <form id="form-signup" class="auth-form hidden">
            <h2>Create a Student Account</h2>
            <div class="input-row">
              <div class="input-group">
                <label for="signup-firstname">Given Name</label>
                <input type="text" id="signup-firstname" name="firstname" required placeholder="John" />
              </div>
              <div class="input-group">
                <label for="signup-lastname">Family Name</label>
                <input type="text" id="signup-lastname" name="lastname" required placeholder="Doe" />
              </div>
            </div>
            <div class="input-group">
              <label for="signup-id">Student ID</label>
              <input
                type="text"
                id="signup-id"
                name="student_id"
                required
                pattern="[0-9]{8}"
                placeholder="8-Digits Student ID"
              />
            </div>
            <div class="input-group">
              <label for="signup-email">StudentEmail</label>
              <input type="email" id="signup-email" required placeholder="user@live.concordia.ca" />
            </div>
            <div class="input-group">
              <label for="signup-password">Password</label>
              <input type="password" id="signup-password" required placeholder="********" />
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
          </form>
        </div>
        <a href="index.html" class="back-home">&larr; Back to Home</a>
      </div>
    </main>
  </body>
</html>
