<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../public/css/styles.css" />
    <link rel="stylesheet" href="../public/css/student.css" />
    <title>My Events</title>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo-link">
        <img src="../public/images/logo.webp" alt="Logo" class="logo" />
        <h1>WebNova</h1>
      </a>
    </header>

    <main>
      <div class="dashboard-shell">
        <section class="hero-card">
          <div>
            <h1>My Events</h1>
            <p>Here are the events you are registered for.</p>
          </div>
        </section>

        <div class="panel">
          <h3>Registered Events</h3>
          <ul id="registered-events-list"></ul>
        </div>

        <div class="registration-actions" style="display: flex; gap: 1rem; flex-wrap: wrap">
          <a href="student-event.html" class="btn btn-primary">Browse All Events</a>
          <a href="student-dashboard.html" class="btn btn-outline">Back to Dashboard</a>
        </div>
      </div>
    </main>

    <script src="../public/js/events-data.js"></script>
    <script>
      const registeredEventIds = [1, 3, 5];
      const registeredEvents = fakeEvents.filter((event) => registeredEventIds.includes(event.event_id));
      const listElement = document.getElementById('registered-events-list');

      if (!registeredEvents.length) {
        listElement.innerHTML =
          '<li class="event-item"><strong>You are not registered for any events yet.</strong></li>';
      } else {
        listElement.innerHTML = registeredEvents
          .map(
            (event) => `
              <li class="event-item">
                <a href="event-details.html?id=${event.event_id}" class="event-link">
                  <strong>${event.title}</strong>
                  <span class="muted">${event.event_date} • ${event.start_time} • ${event.location}</span>
                </a>
              </li>
            `
          )
          .join('');
      }
    </script>

    <footer>
      <p>© 2026 WebNova. All rights reserved.</p>
    </footer>
  </body>
</html>
