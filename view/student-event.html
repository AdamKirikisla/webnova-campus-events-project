<!---Student Events page,
Events are loaded from the backend (GET /events) through public/js/api.js
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../public/images/logo.webp" type="image/webp" />
    <link rel="stylesheet" href="../public/css/styles.css" />
    <link rel="stylesheet" href="../public/css/student.css" />
    <title>Student Event</title>
    <script src="../public/js/api.js" defer></script>
    <script src="../public/js/nav-search.js" defer></script>
    <script src="../public/js/student-event.js" defer></script>
  </head>

  <body>
    <header>
      <a href="index.html" class="logo-link">
        <img src="../public/images/logo.webp" alt="Logo" class="logo" />
        <h1>WebNova</h1>
      </a>
      <nav class="top-nav">
        <div class="nav-search">
          <form id="nav-search-form" role="search" autocomplete="off">
            <input
              type="search"
              id="nav-search-input"
              placeholder="Search events"
              aria-label="Search events"
              aria-expanded="false"
              aria-controls="nav-search-results"
            />
          </form>
          <ul id="nav-search-results" class="nav-search-results" hidden></ul>
        </div>
        <a href="student-dashboard.html" class="btn btn-outline">Dashboard</a>
        <a href="student-profile.html" class="btn btn-outline">Profile</a>
        <a href="my-events.html" class="btn btn-outline">My Events</a>
        <a href="index.html" class="btn btn-primary">Logout</a>
      </nav>
    </header>
    <main>
      <div class="dashboard-shell events-page">
        <section class="hero-card">
          <div>
            <h1>Student Events</h1>
            <p>Welcome to the Student Events page!</p>
          </div>
        </section>

        <div class="dashboard-grid">
          <div class="card">
            <h3>Upcoming Events</h3>
            <ul id="upcoming-events-list"></ul>
          </div>

          <div class="card">
            <h3>Past Events</h3>
            <ul id="past-events-list"></ul>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <p>© 2026 WebNova. All rights reserved.</p>
    </footer>
  </body>
</html>
