<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../public/images/logo.webp" type="image/webp" />
    <link rel="stylesheet" href="../public/css/styles.css" />
    <link rel="stylesheet" href="../public/css/overview.css" />
    <link rel="stylesheet" href="../public/css/admin.css" />

    <title>WebNova - View Registrations</title>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo-link">
        <img src="../public/images/logo.webp" alt="Logo" />
        <h1>WebNova</h1>
      </a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <nav>
        <a href="admin-dashboard.html" class="btn btn-outline">Dashboard</a>
        <a href="manage-events.html" class="btn btn-outline">Manage Events</a>
        <a href="create-event.html" class="btn btn-outline">Create Events</a>
        <a href="index.html" class="btn btn-primary">Logout</a>
      </nav>
    </header>
    <main>
      <h1 id="viewRegistrations">Event Registrations</h1>
      <section class="reg-filters">
        <div class="filter-field">
          <label for="search-student">Search Student ID</label>
          <input type="text" id="search-student" placeholder="e.g. 2" />
        </div>
        <div class="filter-field">
          <label for="event-filter">Event Categories</label>
          <select id="event-filter">
            <option value="all">All Events</option>
            <option value="academic">Academic workshops</option>
            <option value="career">Career events</option>
            <option value="club">Club activities</option>
            <option value="sports">Sports events</option>
            <option value="cultural">Cultural events</option>
            <option value="volunteering">Volunteering events</option>
            <option value="social">Social events</option>
            <option value="guest">Guest lectures</option>
            <option value="networking">Networking events</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="specific-event-filter">Event</label>
          <select id="specific-event-filter">
            <option value="all">All Events</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="status-filter">Status</label>
          <select id="status-filter">
            <option value="all">All Statuses</option>
            <option value="registered">Registered</option>
            <option value="attended">Attended</option>
            <option value="missed">Missed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <span class="reg-count" id="reg-count">0 registrations</span>
      </section>

      <section class="reg-table-wrapper">
        <table class="reg-table">
          <thead>
            <tr>
              <th>Registration ID</th>
              <th>Student ID</th>
              <th>Event Name</th>
              <th>Event ID</th>
              <th>Event Date</th>
              <th>Registration Date</th>
              <th>Registration Status</th>
              <th>Attendance Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="registrations-tbody"></tbody>
        </table>
      </section>
    </main>
    <footer>
      <p>© 2026 WebNova. All rights reserved.</p>
    </footer>
    <script src="../public/js/api.js" defer></script>
    <script src="../public/js/viewRegistrationsAdmin.js" defer></script>
    <script src="../public/js/nav-toggle.js" defer></script>
  </body>
</html>
